<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a14">
        <animate attributeName="stop-color" values="#061a14;#09231b;#061a14" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0d3326">
        <animate attributeName="stop-color" values="#0d3326;#124534;#0d3326" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#04120e">
        <animate attributeName="stop-color" values="#04120e;#082119;#04120e" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Bio Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #a7f3d0;
        letter-spacing: 0.2px;
      }
      .tag {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #6ee7b7;
        letter-spacing: 1.5px;
      }
      .node {
        animation: pulse 4s ease-in-out infinite;
      }
      .wave {
        animation: waveFlow 12s linear infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes waveFlow {
        0% { transform: translateX(0); }
        100% { transform: translateX(-400px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="376" x="2" y="2" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Animated Grid / Topography Contour Lines -->
  <g opacity="0.15">
    <path d="M-100,80 Q200,120 500,70 T1100,100 T1500,60" fill="none" stroke="#34d399" stroke-width="2">
      <animate attributeName="d" 
        values="M-100,80 Q200,120 500,70 T1100,100 T1500,60;
                M-100,90 Q200,60 500,100 T1100,70 T1500,90;
                M-100,80 Q200,120 500,70 T1100,100 T1500,60" 
        dur="10s" repeatCount="indefinite" />
    </path>
    <path d="M-100,160 Q250,110 550,170 T1150,140 T1500,150" fill="none" stroke="#06b6d4" stroke-width="2">
      <animate attributeName="d" 
        values="M-100,160 Q250,110 550,170 T1150,140 T1500,150;
                M-100,140 Q250,180 550,130 T1150,170 T1500,140;
                M-100,160 Q250,110 550,170 T1150,140 T1500,150" 
        dur="12s" repeatCount="indefinite" />
    </path>
    <path d="M-100,240 Q300,290 600,230 T1200,260 T1500,220" fill="none" stroke="#10b981" stroke-width="2">
      <animate attributeName="d" 
        values="M-100,240 Q300,290 600,230 T1200,260 T1500,220;
                M-100,260 Q300,210 600,270 T1200,220 T1500,250;
                M-100,240 Q300,290 600,230 T1200,260 T1500,220" 
        dur="14s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Glowing Constellation Nodes & Environmental Network -->
  <g id="network" opacity="0.6">
    <!-- Connecting network lines -->
    <line x1="880" y1="90" x2="980" y2="140" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="980" y1="140" x2="1080" y2="100" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="980" y1="140" x2="940" y2="250" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="940" y1="250" x2="1060" y2="270" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="1080" y1="100" x2="1060" y2="270" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="880" y1="90" x2="940" y2="250" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />

    <!-- Node 1: eDNA / Molecular -->
    <circle cx="880" cy="90" r="7" fill="#10b981" filter="url(#subtleGlow)">
      <animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- Node 2: AI Vision / Camera Traps -->
    <circle cx="980" cy="140" r="12" fill="#34d399" filter="url(#glow)">
      <animate attributeName="r" values="10;14;10" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
    <!-- Node 3: Satellite Geospatial Monitoring -->
    <circle cx="1080" cy="100" r="8" fill="#06b6d4" filter="url(#subtleGlow)">
      <animate attributeName="r" values="7;10;7" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <!-- Node 4: Bioacoustics -->
    <circle cx="940" cy="250" r="9" fill="#10b981" filter="url(#subtleGlow)">
      <animate attributeName="r" values="8;11;8" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <!-- Node 5: TNFD / Nature Metrics -->
    <circle cx="1060" cy="270" r="10" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="9;13;9" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Central Dynamic Floating Elements / Biology & Earth Motif -->
  <g transform="translate(980, 195)" filter="url(#subtleGlow)">
    <!-- Rotating Bio-Radar Ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="10, 15" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="6, 8" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite" />
    </circle>
    <!-- Leaf / Life Core Motif -->
    <path d="M0,-24 C16,-16 24,4 0,24 C-24,4 -16,-16 0,-24 Z" fill="url(#accentGrad)" opacity="0.85">
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M0,-20 L0,20" stroke="#061a14" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 75)">
    <!-- Pill Tag -->
    <rect width="275" height="30" rx="15" fill="#0d3326" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="15" r="4" fill="#34d399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="20" class="tag">CURATED ECOSYSTEM • 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">
      Awesome <tspan fill="url(#accentGrad)">Biodiversity</tspan> Management
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="128" class="subtitle">
      Top SaaS Platforms, Open-Source Tools, eDNA, Bioacoustics &amp; AI
    </text>
    <text x="0" y="156" class="subtitle" font-size="16px" fill="#94a3b8">
      Empowering Conservation Science, TNFD Nature Reporting &amp; Planetary Health
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 195)">
      <!-- Badge 1: eDNA & Genomics -->
      <rect x="0" y="0" width="145" height="32" rx="8" fill="#09281e" stroke="#059669" stroke-width="1" />
      <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13px" font-weight="600" fill="#6ee7b7">🧬 eDNA &amp; Genetics</text>

      <!-- Badge 2: AI Wildlife & Camera Traps -->
      <rect x="155" y="0" width="160" height="32" rx="8" fill="#09281e" stroke="#059669" stroke-width="1" />
      <text x="167" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13px" font-weight="600" fill="#6ee7b7">📸 Wildlife AI Vision</text>

      <!-- Badge 3: Geo-Spatial & Habitats -->
      <rect x="325" y="0" width="155" height="32" rx="8" fill="#09281e" stroke="#059669" stroke-width="1" />
      <text x="337" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13px" font-weight="600" fill="#6ee7b7">🛰️ Geospatial &amp; GIS</text>

      <!-- Badge 4: TNFD & Nature Finance -->
      <rect x="490" y="0" width="165" height="32" rx="8" fill="#09281e" stroke="#059669" stroke-width="1" />
      <text x="502" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13px" font-weight="600" fill="#6ee7b7">🌿 TNFD &amp; Metrics</text>
    </g>
  </g>
</svg>
